
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent &amp; Child ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fff0f5;
    font-family: "Georgia", serif;
    color: #70445a;
}

.parent {
    width: 80%;
    min-height: 420px;
    background: #ffd6e7;
    margin-left: 10%;
    margin-top: 70px;
    position: relative;
    padding: 25px;
    border: 2px dashed #c7799c;
    border-radius: 25px;
}

.child {
    width: 50%;
    height: 200px;
    background: #e8d5ff;
    position: absolute;
    bottom: 20px;
    right: 20px;
    left: auto;
    top: auto;
    margin: auto;
    z-index: 9000;
    border: 2px solid #b79ad9;
    border-radius: 22px;
    box-shadow: 6px 6px 0 #d6b9f0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 15px;
}

h1 {
    color: #b45f88;
}

h2 {
    color: #9066b0;
}

p {
    line-height: 1.7;
}

.decor {
    font-size: 24px;
}
</style>
</head>

<body>
    <div class="parent">
        <div class="decor">୨୧ ♡ ୨୧</div>

        <h1>My little universe</h1>

        <p>
            A heart made of ribbons
            <br>
            and dreams made of stars.
        </p>

        <div class="child">
            <div class="decor">♡ ₊˚⊹♡</div>
            <h2>Little angel</h2>
            <p>Too cute for this world ୨୧</p>
        </div>
    </div>
</body>
</html>
